[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrsig"
version = "0.1.0"
description = "Signed QR codes: a signature hidden in the padding, verified against the issuing domain's keys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "qrcode[pil]>=7.4"]

[project.optional-dependencies]
read = ["zxing-cpp>=2.2", "reedsolo>=1.7"]
test = ["zxing-cpp>=2.2", "reedsolo>=1.7", "pytest>=8", "pyzbar>=0.1.9"]

[project.scripts]
qrsig = "qrsig.cli:main"

[tool.setuptools]
packages = ["qrsig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
